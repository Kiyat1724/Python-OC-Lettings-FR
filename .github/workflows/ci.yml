name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  DJANGO_SECRET_KEY: "ci-only-placeholder-not-for-production-0123456789abcdef0123456789"
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
  SENTRY_DSN: ""

jobs:
  quality:
    name: Verification du projet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Installer uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Installer les dependances avec uv
        run: uv pip install --system -r requirements.txt

      - name: Verifier les dependances
        run: uv pip check --system

      - name: Verifier la configuration Django
        run: python manage.py check

      - name: Verifier les migrations des modeles
        run: python manage.py makemigrations --check --dry-run

      - name: Verifier le code avec Flake8
        run: python -m flake8

      - name: Collecter les fichiers statiques
        run: python manage.py collectstatic --noinput

      - name: Executer les tests et mesurer la couverture
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Construire l'image Docker
        run: docker build -t oc-lettings:ci .
