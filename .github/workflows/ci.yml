name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Verification du projet
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installer les dependances
        run: python -m pip install -r requirements.txt

      - name: Verifier les dependances
        run: python -m pip check

      - name: Verifier la configuration Django
        run: python manage.py check

      - name: Verifier les migrations des modeles
        run: python manage.py makemigrations --check --dry-run

      - name: Verifier le code avec Flake8
        run: python -m flake8

      - name: Executer les tests et mesurer la couverture
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Construire l'image Docker
        run: docker build -t oc-lettings:ci .
